<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1015" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>NeXus Revenue OS</title>

    <script>
      var hostname = window.location.hostname;
      var environment = hostname === 'localhost' ? 'localhost'
        : hostname.includes('preview--') ? 'preview'
        : 'production';

      var devMode = localStorage.getItem('developer_mode') === 'true';
      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('developer') === 'true') {
        devMode = true;
        localStorage.setItem('developer_mode', 'true');
      }
      if (urlParams.get('developer') === 'false') {
        devMode = false;
        localStorage.removeItem('developer_mode');
      }

      var isLocalhost = hostname === 'localhost' || hostname === '127.0.0.1';
      var ignoreAnalytics = localStorage.getItem('ignore-analytics') === 'true';
      var shouldTrack = !isLocalhost && !ignoreAnalytics;

      if (!shouldTrack) {
        window.gtag = function() {};
      } else {
        var script = document.createElement('script');
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-47T32Z43L2";
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){dataLayer.push(arguments);}
        gtag('js', new Date());

        var gaParams = {
          user_properties: {
            environment: environment,
            app_version: '1.0.0'
          }
        };

        if (devMode) {
          gaParams.traffic_type = 'internal';
          gaParams.debug_mode = true;
          gaParams.user_properties.role = 'developer';
        }

        gtag('config', 'G-47T32Z43L2', gaParams);

        if (devMode) {
          gtag('event', 'developer_mode_enabled', { environment: environment });
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0e1015;
        color: #f8fafc;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
      }
      .splash-h {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      .splash-h .c0 { color: #38bdf8; }
      .splash-h .c1 { color: #10b981; }
      .splash-h .c2 { color: #f59e0b; }
      .splash-h .c3 { color: #a855f7; }
      .splash-bar {
        width: 120px;
        height: 3px;
        background: #1e232d;
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-fill {
        width: 40%;
        height: 100%;
        background: #38bdf8;
        border-radius: 2px;
        animation: slide 1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-h">
          <span class="c0">N</span><span class="c1">e</span><span class="c2">X</span><span class="c3">u</span><span class="c0">s</span>
        </div>
        <div class="splash-bar"><div class="splash-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
