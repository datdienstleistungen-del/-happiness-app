[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/reddit-proxy/*"
  to = "/.netlify/functions/reddit-proxy/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Public creator profiles — serve HTML+JSON-LD for crawlers (BEFORE SPA fallback)
[[redirects]]
  from = "/creator/:slug"
  to = "/.netlify/functions/creator-profile/:slug"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
